name: Archive verification
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  static-and-browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: quantumcore-wotlk-db
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: quantumcore-wotlk-db/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: npm ci && npm test
        working-directory: quantumcore-wotlk-db
      - run: npx playwright install --with-deps chromium
        working-directory: quantumcore-wotlk-db
      - run: npm run test:browser
        working-directory: quantumcore-wotlk-db
  mariadb-roundtrip:
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: disposable-ci-only
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/test_roundtrip.py --host 127.0.0.1 --report /tmp/mariadb-roundtrip.json
        env:
          MYSQL_TEST_PASSWORD: disposable-ci-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mariadb-roundtrip
          path: /tmp/mariadb-roundtrip.json
